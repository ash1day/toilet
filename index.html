<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>トイレ危険地帯</title>
    <link rel="icon" href="toilet.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""

    <script type="importmap">
      { "imports": { "d3-delaunay": "https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/+esm" } }
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>トイレ危険地帯</h1>
      <p>
        鯖江市のトイレ情報データセット(by 鯖江市役所)を利用して、トイレが無い場所の可視化を行いました。LODを使ってモノがある場所の可視化をすることは広まってきたので、本アプリではモノがないことを可視化することを目標に制作しました。データセットの差し替えによる逆マッシュアップによって、様々な場面で、市民の立場からの利便性向上や、行政やビジネスの立場からの意思決定材料に役立てられることを期待します。
      </p>
      <div id="map"></div>
      <p class="credit">制作: Yoshihiro ASHIDA and Yosuke ONOUE</p>
      <p class="credit">
        データ:
        <a href="https://ckan.odp.jig.jp/dataset/jp-fukui-sabae-202-odp">公共トイレ(福井県鯖江市)</a>
        (<a href="https://creativecommons.org/licenses/by/2.1/jp/">CC BY 2.1 JP</a>)
      </p>
    </main>
  </body>
</html>
